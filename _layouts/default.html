<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% if page.math %}{% include mathjax.html %}{% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="masthead">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Writing</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="{{ '/feed.xml' | relative_url }}">Feed</a>
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="colophon">
    <p>Built with Jekyll, hosted on GitHub Pages. Maths set with MathJax.</p>
    <p><a href="https://github.com/{{ site.github_username }}">github.com/{{ site.github_username }}</a></p>
  </footer>
</body>
</html>
